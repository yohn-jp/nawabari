name: Issue Governance

# Canonical wrapper distributed via .github/sync.yml (SKIP_PR: true, direct
# push) — do not hand-edit in a consumer repository; edit this file in
# yohn-jp/.github instead.

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

jobs:
  validate-issue:
    # The provider revision is immutable; validation still executes against
    # this repository's checked-in .github/inari snapshot.
    uses: yohn-jp/.github/.github/workflows/issue-governance.yml@1231c1ba59f5eb2ab053f39327b0d6cf64fee809
    permissions:
      contents: read
      issues: write
