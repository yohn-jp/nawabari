name: Issue Governance

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

jobs:
  validate-issue:
    name: validate-issue
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default-branch validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate Issue contract
        id: validate
        continue-on-error: true
        run: node scripts/validate-issue.mjs --event "$GITHUB_EVENT_PATH" --report /tmp/issue-governance.md

      - name: Mark invalid Issue
        if: steps.validate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if ! [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Issue number must be numeric" >&2
            exit 1
          fi
          gh label create "status:invalid" --color D73A4A --description "Issue governance contract violation" --force
          gh issue edit "$ISSUE_NUMBER" --add-label "status:invalid"
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/issue-governance.md

      - name: Clear invalid label
        if: steps.validate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if ! [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Issue number must be numeric" >&2
            exit 1
          fi
          gh issue edit "$ISSUE_NUMBER" --remove-label "status:invalid" 2>/dev/null || true
