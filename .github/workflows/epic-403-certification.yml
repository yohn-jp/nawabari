name: Epic 403 delegated cgroups v2 certification

on:
  pull_request:
    branches:
      - epic/403-worktree-local-runtime
    paths:
      - .github/workflows/epic-403-certification.yml

permissions:
  contents: read

jobs:
  certify:
    name: Epic 403 supported-Linux certification
    uses: yohn-jp/.github/.github/workflows/linux-system-e2e.yml@main
    with:
      pre-command: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y bubblewrap
        if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
        sudo cp "$(command -v node)" /usr/bin/node
      command: |
        set -euo pipefail

        echo "=== host evidence ==="
        uname -a
        id
        node --version
        pnpm --version
        nix --version
        stat -fc %T /sys/fs/cgroup
        cat /proc/self/cgroup

        echo "=== focused delegated-cgroup conformance ==="
        node --test --import tsx src/domain/session-launch-supervisor-worker.test.ts

        echo "=== packed package suite ==="
        node scripts/run-package-suite.mjs

        echo "=== full verification ==="
        pnpm run verify
      timeout-minutes: 40
