name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "31 3 * * 1"

permissions: {}

jobs:
  analyze:
    name: CodeQL
    uses: yohn-jp/.github/.github/workflows/codeql.yml@1231c1ba59f5eb2ab053f39327b0d6cf64fee809
    with:
      languages: javascript-typescript,actions
      config-file: ./.github/codeql/codeql-config.yml
    permissions:
      contents: read
      security-events: write
      actions: read
