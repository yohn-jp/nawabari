name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  typescript:
    needs: changes
    name: shared TypeScript CI
    uses: yohn-jp/.github/.github/workflows/typescript-cli-ci.yml@main
    with:
      node-version: "24"
      release-docs-fast-path: ${{ needs.changes.outputs.release_docs_only == 'true' }}
      docs-path-patterns: docs/releases/**
    permissions:
      contents: read

  changes:
    name: detect release-docs-only change
    runs-on: ubuntu-latest
    outputs:
      release_docs_only: ${{ steps.check.outputs.release_docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check whether this is a release/<semver> branch touching only docs/releases
        id: check
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [[ ! "$HEAD_REF" =~ ^release/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release_docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed_files="$(git diff --name-only "$BASE_SHA"...HEAD)"
          if [ -n "$changed_files" ] && ! grep -qv '^docs/releases/' <<< "$changed_files"; then
            echo "release_docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  release-docs-governance:
    needs: changes
    if: needs.changes.outputs.release_docs_only == 'true'
    name: governance validation (release docs only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify GitHub Actions are pinned by SHA
        run: pnpm run governance:actions

      - name: Verify GitHub Actions workflow structure
        run: pnpm run governance:workflows

  nawabari-validation:
    needs: changes
    if: needs.changes.outputs.release_docs_only != 'true'
    name: Nawabari manifest / governance validation (Node 24)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated Product State Manifest diagram
        run: pnpm run manifest:check

      - name: Verify generated CLI skill playbook
        run: pnpm run skill:check

      - name: Verify GitHub Actions are pinned by SHA
        run: pnpm run governance:actions

      - name: Verify GitHub Actions workflow structure
        run: pnpm run governance:workflows

  tgrep-runtime-conformance:
    needs: changes
    if: needs.changes.outputs.release_docs_only != 'true'
    name: pinned tgrep runtime / protected execution conformance (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Enable unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false

      - name: Materialize and execute the pinned tgrep runtime
        run: pnpm run test:tgrep:conformance

  pnpm-middleware-runtime-conformance:
    needs: changes
    if: needs.changes.outputs.release_docs_only != 'true'
    name: pinned RTK / pnpm middleware backend conformance (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Enable unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false

      - name: Project a canonical FHS-rooted Node interpreter
        # actions/setup-node installs into /opt/hostedtoolcache, which is not
        # a bounded FHS root that materializeFhsRuntime() accepts. Copy the
        # exact same pinned Node binary to a canonical /usr/bin location so
        # the protected conformance test can declare it as a real FHS
        # artifact without weakening FHS_RUNTIME_ROOTS validation.
        run: |
          sudo cp "$(command -v node)" /usr/bin/node
          echo "NAWABARI_TEST_FHS_NODE_INTERPRETER=/usr/bin/node" >> "$GITHUB_ENV"

      - name: Materialize and verify pinned RTK and pnpm middleware backends
        run: pnpm run test:pnpm:conformance

  package:
    needs: changes
    if: needs.changes.outputs.release_docs_only != 'true'
    name: build / package contents / smoke test (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Package contents and smoke test
        run: node scripts/run-package-suite.mjs

  release-build:
    needs: changes
    if: needs.changes.outputs.release_docs_only != 'true' && startsWith(github.head_ref, 'release/')
    name: release tarball build (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and validate the exact release tarball
        run: pnpm run build && node scripts/run-package-suite.mjs --keep-tarball

  mottainai-uid-handoff:
    needs: changes
    if: needs.changes.outputs.release_docs_only != 'true'
    name: packed Mottainai UID handoff evidence (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Enable unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Packed Mottainai UID handoff evidence
        run: pnpm run test:package:mottainai
