name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag matches package version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "package.json version $package_version requires release tag $expected_tag, got $RELEASE_TAG"
            exit 1
          fi
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
          echo "tarball_name=nawabari-${package_version}.tgz" >> "$GITHUB_OUTPUT"

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Verify GitHub Actions are pinned by SHA
        run: pnpm run governance:actions

      - name: Build and validate the exact release tarball
        run: pnpm run build && node scripts/run-package-suite.mjs --keep-tarball

      - name: Upload validated tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-tarball
          path: ${{ steps.version.outputs.tarball_name }}
          if-no-files-found: error
          retention-days: 1

  smoke-test:
    needs: build
    name: packed package smoke test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-tarball

      - name: Smoke test the validated tarball
        run: |
          package_version="$(node -p "require('./package.json').version")"
          node scripts/smoke-test.mjs --tarball "$GITHUB_WORKSPACE/nawabari-${package_version}.tgz"

  publish:
    needs: smoke-test
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Require an OIDC-capable npm CLI
        run: npm install --global npm@11.5.1

      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-tarball

      - name: Validate the exact tarball before publish
        run: |
          package_version="$(node -p "require('./package.json').version")"
          node scripts/validate-release-tarball.mjs "$GITHUB_WORKSPACE/nawabari-${package_version}.tgz" --publish-dry-run

      - name: Check whether version is already published
        id: registry
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if npm view "nawabari@$package_version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish validated tarball
        if: steps.registry.outputs.published != 'true'
        run: |
          package_version="$(node -p "require('./package.json').version")"
          set -o pipefail
          npm publish "$GITHUB_WORKSPACE/nawabari-${package_version}.tgz" 2>&1 | tee publish.log
          if grep -q "npm warn publish" publish.log; then
            echo "npm emitted a publish warning; treating as failure"
            exit 1
          fi
