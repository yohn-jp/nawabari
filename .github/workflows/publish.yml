name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Verify GitHub Actions are pinned by SHA
        run: pnpm run governance:actions

      - name: Build and validate the exact release tarball
        run: pnpm run build && node scripts/run-package-suite.mjs --keep-tarball

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${RELEASE_TAG#v}"
          if [ "$package_version" != "0.1.0" ] || [ "$package_version" != "$tag_version" ]; then
            echo "package.json version $package_version does not match v0.1.0/tag $tag_version"
            exit 1
          fi

      - name: Upload validated tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-tarball
          path: nawabari-0.1.0.tgz
          if-no-files-found: error
          retention-days: 1

  smoke-test:
    needs: build
    name: packed package smoke test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-tarball

      - name: Smoke test the validated tarball
        run: node scripts/smoke-test.mjs --tarball "$GITHUB_WORKSPACE/nawabari-0.1.0.tgz"

  publish:
    needs: smoke-test
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-tarball

      - name: Validate the exact tarball before publish
        run: node scripts/validate-release-tarball.mjs "$GITHUB_WORKSPACE/nawabari-0.1.0.tgz" --publish-dry-run

      - name: Require an authenticated npm credential
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is required for first publication; Trusted Publishing is not a bootstrap prerequisite" >&2
            exit 1
          fi

      - name: Check namespace and version immediately before publish
        run: |
          if ! status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 30 https://registry.npmjs.org/nawabari)"; then
            echo "could not verify npm namespace availability" >&2
            exit 1
          fi
          case "$status" in
            404) ;;
            200)
              echo "nawabari already exists; refusing a namespace collision" >&2
              exit 1
              ;;
            *)
              echo "npm namespace lookup returned HTTP $status" >&2
              exit 1
              ;;
          esac

      - name: Publish validated tarball
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "$GITHUB_WORKSPACE/nawabari-0.1.0.tgz"
