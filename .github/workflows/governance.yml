name: Governance

# Canonical wrapper distributed via .github/sync.yml (SKIP_PR: true, direct
# push) — do not hand-edit in a consumer repository; edit this file in
# yohn-jp/.github instead.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

concurrency:
  group: governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-pr:
    # The provider revision is immutable; validation still executes against
    # this repository's checked-in .github/inari snapshot.
    uses: yohn-jp/.github/.github/workflows/pr-governance.yml@1231c1ba59f5eb2ab053f39327b0d6cf64fee809
    permissions:
      contents: read
