name: Detect release-docs-only change
description: Detect the exceptional release branch change set without gating ordinary jobs

outputs:
  release_docs_only:
    description: Whether this is a release/<semver> change that touches only docs/releases
    value: ${{ steps.check.outputs.release_docs_only }}

runs:
  using: composite
  steps:
    - name: Check whether this is a release/<semver> branch touching only docs/releases
      id: check
      shell: bash
      env:
        HEAD_REF: ${{ github.head_ref }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        if [ -z "$BASE_SHA" ] || [[ ! "$HEAD_REF" =~ ^release/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "release_docs_only=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
        fi
        changed_files="$(git diff --name-only "$BASE_SHA"...HEAD)"
        if [ -n "$changed_files" ] && ! grep -qv '^docs/releases/' <<< "$changed_files"; then
          echo "release_docs_only=true" >> "$GITHUB_OUTPUT"
        else
          echo "release_docs_only=false" >> "$GITHUB_OUTPUT"
        fi
