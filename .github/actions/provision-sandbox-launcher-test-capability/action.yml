name: Provision sandbox-launcher test capability
description: Install Nawabari's repository-owned controlled sandbox-launcher test executable.
runs:
  using: composite
  steps:
    - name: Install controlled sandbox launcher
      shell: bash
      run: |
        set -euo pipefail
        test_fixture="$GITHUB_ACTION_PATH/../../../scripts/test-fixtures/sandbox-launcher-test-stub.sh"
        if [[ ! -f "$test_fixture" ]]; then
          echo "sandbox-launcher test fixture is missing from the workflow source: $test_fixture" >&2
          exit 1
        fi
        sudo install -m 0755 "$test_fixture" /usr/local/bin/nawabari-sandbox-test-stub
