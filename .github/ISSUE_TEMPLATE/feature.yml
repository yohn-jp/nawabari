name: Feature
description: New capability or enhancement
title: "feat: "
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: What is currently not possible, and why it matters }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposal, description: Proposed behavior or API }
    validations: { required: true }
  - type: textarea
    id: non_goals
    attributes: { label: Non-goals, description: Explicitly excluded scope }
    validations: { required: false }
  - type: textarea
    id: acceptance
    attributes: { label: Acceptance criteria, description: Completion criteria, value: "- [ ] " }
    validations: { required: true }
